# Alacritty config generated from your kitty.conf

# Use same colorscheme in neovim and alacritty
# Lazy install neovim plugins to make this file available:q

general.import = ["~/.local/share/nvim/lazy/vscode.nvim/extra/alacritty/vscode-dark.toml"]
[colors]
#primary.background = "#000000"

# --- Fonts ---
[font]
size = 8.0
offset = { x = 0, y = 1 }

[font.normal]
family = "JetBrainsMono Nerd Font"
#family = "IosevkaTerm Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"


# --- Cursor ---
[cursor]
style.shape = "Block"
# style.blinking = "Never"

# --- Scrolling ---
[scrolling]
history = 10000
multiplier = 3

# --- Window ---
[window]
padding = { x = 3, y = 3 }
dynamic_padding = false
decorations = "None"   # fastest, minimal; remove if you want titlebar
# Alacritty has no confirm-on-close prompt; nothing to set for kitty's confirm_os_window_close.

# --- Selection / Clipboard ---
[selection]
# kitty's copy_on_select yes
save_to_clipboard = true

# --- Tabs / UI ---
# Note: Alacritty does not implement tabs, so kitty's tab_bar_style has no equivalent.

# --- Colors / Theme ---
# kitty: include themes/Afterglow.conf
# In Alacritty you can import a theme file. If you have an Afterglow palette for Alacritty,
# place it at the path below (or adjust to where you keep themes).
#import = ["~/.config/alacritty/themes/afterglow.toml"]
# If you don't have an Afterglow theme file yet, you can comment the import above
# and paste a [colors] section here later.

