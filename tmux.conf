##### CORE ############################################################

set -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',ghostty:Tc,xterm-256color:Tc,tmux-256color:Tc'
set -sg escape-time 10
set -w -g mode-keys vi

# Always show the running command as the window name, never the hostname
set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"
set -g allow-rename off


##### SPLITS ###########################################################

bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"


##### PANE NAV (NO PREFIX) ############################################

bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R


##### PLUGINS (TPM) ###################################################

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.1.3'


##### CATPPUCCIN #######################################################

set -g @catppuccin_flavor 'mocha'

# Window tabs
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_window_default_text "#{pane_current_command}"
set -g @catppuccin_window_current_text "#{pane_current_command}"
set -g @catppuccin_window_text " #{pane_current_command}"
set -g @catppuccin_window_current_text " #{pane_current_command}"

# Status bar — padding space before session pill, date/time on right
set -g status-left-length 100
set -g status-right-length 100
set -g status-left " #{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_date_time} "


##### BOOTSTRAP & INIT ################################################

if-shell '[ ! -d ~/.tmux/plugins/tpm ]' \
  'run-shell "git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm"'

run '~/.tmux/plugins/tpm/tpm'
