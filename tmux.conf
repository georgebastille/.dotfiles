##### CORE ############################################################

# Mouse stays on (you already had this)
set -g mouse on

# Make tmux use a modern terminfo.
# Best option if installed: tmux-256color.
# If you ever see "unknown terminal: tmux-256color", switch to screen-256color.
set -g default-terminal "screen-256color"

# Truecolor:
# Alacritty supports RGB; this ensures tmux doesn't strip it.
# Use a broad override that matches both alacritty and xterm-256color.
set -as terminal-overrides ',alacritty:Tc,xterm-256color:Tc,screen-256color:Tc'

# Faster Neovim escape / key-chords
set -sg escape-time 10

# Vi copy mode (you already had this)
set -w -g mode-keys vi


##### SPLITS ###########################################################

# Keep your split keys + cwd inheritance
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"


##### PANE NAV (NO PREFIX) ############################################

# Keep your vim-like pane nav with no prefix
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R


##### PLUGINS (TPM) ###################################################

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'jimeh/tmux-themepack'
#set -g @themepack 'basic'   # try 'powerline/default/cyan' if you want powerline look
set -g @themepack 'powerline/default/cyan' #if you want powerline look

# Bootstrap TPM if missing (your syntax is good)
if-shell '[ ! -d ~/.tmux/plugins/tpm ]' \
  'run-shell "git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm"'

# Initialize TPM (keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
