# -----------------------------------------------------------------------------
# Kitty config for fast startup + tmux workflow (Pixelbook Eve / Wayland)
# All options below are from official kitty docs.
# -----------------------------------------------------------------------------

# --- Terminal identity / colors ------------------------------------------------
term xterm-kitty
enable_audio_bell no
detect_urls no
window_margin_width 0
confirm_os_window_close 0
copy_on_select yes

# Truecolor is automatic in kitty; no extra setting needed.
# Keep background fully opaque for fastest startup & lowest GPU churn.
background_opacity 1.0
# Colors: comment out if you don't download a theme
include themes/Afterglow.conf

# Hide decorations to reduce Wayland negotiation work.
hide_window_decorations yes

# --- Fonts (explicit = faster than scanning) ----------------------------------
# Set ONE font family explicitly to avoid slow fallback probing.
font_family      family='NotoSansM Nerd Font Mono' postscript_name=NotoSansMNFM-Reg
#font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size        9

# Keep fallback enabled (safer for unicode/emoji in logs).
# If you want max speed and don't care about fallback glyphs, you can try:
# disable_font_fallback yes

# --- Rendering / performance --------------------------------------------------
# Slightly reduce redraw overhead without hurting interactivity.
repaint_delay 8
input_delay 0
sync_to_monitor yes

# --- Scrollback ---------------------------------------------------------------
scrollback_lines 50000

# --- Tabs / layout (minimal because tmux handles panes) -----------------------
enabled_layouts tall,grid,splits

# Keep tab bar unobtrusive (kitty tabs still useful for top-level grouping).
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
active_tab_font_style bold
inactive_tab_font_style normal

# --- Shell integration --------------------------------------------------------
# You use tmux, so kitty shell integration isn't that useful and costs startup.
shell_integration disabled

# --- Remote control (needed for single-instance + @ launch) -------------------
allow_remote_control yes

# --- Key mappings (light tmux-like sugar, not a tmux replacement) -------------
# Open a new OS window quickly
map ctrl+shift+enter new_os_window

# Optional: simple kitty splits if you ever want them outside tmux
# map ctrl+shift+d launch --location=hsplit
# map ctrl+shift+v launch --location=vsplit
